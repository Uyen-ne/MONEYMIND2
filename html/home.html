<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyMind - Trang chủ</title>
    
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/responsive.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="home-bg">

    <nav class="navbar">
        <div class="logo">
            <img src="../assets/icon/logo.png" alt="MoneyMind">
            <span>MoneyMind</span>
        </div>

        <div class="nav-right-group">
            <ul class="nav-links">
                <li><a href="category.html">Danh mục</a></li>
                <li><a href="transaction.html">Giao dịch</a></li>
                <li><a href="goal.html">Mục tiêu</a></li>
                <li><a href="wallet.html">Ví của tôi</a></li>
            </ul>
            <div class="nav-icons">
                <img src="../assets/icon/bell.png" alt="Notification" class="icon">
                <img src="../assets/icon/avatar.png" alt="User" class="avatar-img">
            </div>
        </div>
    </nav>
  
    <div class="container">
        <header class="header-card">
            <div class="balance-info">
                <div class="user-avatar-container">
                     <img src="../assets/icon/avatar.png" alt="Avatar" class="user-avatar-img">
                 </div>
                 <div>
                    <p>Số dư hiện tại</p>
                    <h2 id="totalBalance">0 đ</h2>
                </div>
            </div>
            <div class="alert-info">
                <p id="altertText">Đang tải dữ liệu chi tiêu...</p>
            </div>
        </header>

        <section class="stats-section">
            <div class="stats-left" style="display: flex; flex-direction: column; gap: 20px;">
                <div class="stats-header" style="display: flex; flex-direction: column; align-items: flex-start; gap: 15px;">
                    <h2 style="margin: 0;">Thống kê chung</h2>
                    
                    <div class="global-filters" style="display: flex; gap: 10px; align-items: center; width: 100%;">
                        
                        <!-- 1. BỘ LỌC THỜI GIAN -->
                        <div class="filter-wrapper" style="position: relative; z-index: 10;">
                            <button class="filter-btn" onclick="toggleFilterMenu('timeFilterMenu')" style="display: flex; align-items: center; gap: 5px; padding: 6px 12px; border: 1px solid #ccc; border-radius: 20px; background: white; cursor: pointer;">
                                <img src="../assets/icon/filter.png" alt="Bộ lọc" style="width: 14px;">
                                <span id="timeFilterResult" style="font-size: 13px;">Tháng này</span>
                            </button>
                            
                            <!-- Popup Thời Gian -->
                            <div class="filter-popup" id="timeFilterMenu" style="display: none; position: absolute; top: 110%; left: 0; background: white; border: 1px solid #eee; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 12px; border-radius: 12px; width: 180px;">
                                <p style="margin: 0 0 10px 0; font-size: 13px; color: #666;">Lọc theo thời gian:</p>
                                <div style="display: flex; flex-direction: column; gap: 6px;">
                                    <button type="button" class="opt-btn" onclick="showTimeInput('date')" style="padding: 6px; border: none; background: #ffd8d8; border-radius: 6px; cursor: pointer;">Theo ngày</button>
                                    <button type="button" class="opt-btn" onclick="showTimeInput('week')" style="padding: 6px; border: none; background: #ffd8d8; border-radius: 6px; cursor: pointer;">Theo tuần</button>
                                    <button type="button" class="opt-btn" onclick="showTimeInput('month')" style="padding: 6px; border: none; background: #ffd8d8; border-radius: 6px; cursor: pointer;">Theo tháng</button>
                                </div>
                                <div id="calendarBox" style="display: none; margin-top: 10px;">
                                    <input type="date" id="dateInput" style="display: none; width: 100%; padding: 5px; border-radius: 5px; border: 1px solid #ccc;" onchange="applyTimeFilter(this.value, 'date')">
                                    <input type="week" id="weekInput" style="display: none; width: 100%; padding: 5px; border-radius: 5px; border: 1px solid #ccc;" onchange="applyTimeFilter(this.value, 'week')">
                                    <input type="month" id="monthInput" style="display: none; width: 100%; padding: 5px; border-radius: 5px; border: 1px solid #ccc;" onchange="applyTimeFilter(this.value, 'month')">
                                </div>
                            </div>
                        </div>

                        <!-- 2. BỘ LỌC VÍ -->
                        <div class="filter-wrapper" style="position: relative; z-index: 10;">
                            <button class="filter-btn" onclick="toggleFilterMenu('walletFilterMenu')" style="display: flex; align-items: center; gap: 5px; padding: 6px 12px; border: 1px solid #ccc; border-radius: 20px; background: white; cursor: pointer;">
                                <span id="walletFilterResult" style="font-size: 13px;">Tất cả ví</span>
                            </button>
                            
                            <!-- Popup Ví -->
                            <div class="filter-popup" id="walletFilterMenu" style="display: none; position: absolute; top: 110%; left: 0; background: white; border: 1px solid #eee; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 12px; border-radius: 12px; width: 140px;">
                                <p style="margin: 0 0 10px 0; font-size: 13px; color: #666;">Lọc theo ví:</p>
                                <div id="walletFilterOptions" style="display: flex; flex-direction: column; gap: 6px;">
                                    <!-- Nút tĩnh mặc định, các ví khác sẽ được API append vào đây -->
                                    <button type="button" onclick="applyWalletFilter(null, 'Tất cả ví')" style="padding: 6px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer;">Tất cả ví</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Chứa danh sách thống kê -->
                <div id="statItems"></div>
            </div>

            <div class="stats-right">
                <canvas id="myPieChart"></canvas>
            </div>
        </section>

        <section class="recent-transactions">
            <h3>Giao dịch gần đây</h3>
            <div class="trans-list" id="transList"></div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="../js/api.js"></script>
    <script src="../js/chart-setup.js"></script>
    <script src="../js/global-menu.js"></script>
    <script src="../js/home.js"></script>
</body>
</html>
