<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - MoneyMind</title>
    
    <link rel="stylesheet" href="../css/common.css"> 
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="change-password-page">

    <div class="main-container">
        <div class="bottom-background"></div>

        <div class="login-wrapper">
            <div class="login-card">
                <h1 class="login-title">ĐỔI MẬT KHẨU</h1>
                
                <form action="#" method="post">
                    <div class="input-group">
                        <label for="old-pass">MẬT KHẨU CŨ</label>
                        <div class="password-wrapper" style="position: relative;">
                            <input type="password" id="old-pass" name="old-pass" required style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                            <img src="../assets/icon/eye-closed.png" id="eyeIconOld" onclick="togglePassword('old-pass', 'eyeIconOld')" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; width: 20px;">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="new-pass">MẬT KHẨU MỚI</label>
                        <div class="password-wrapper" style="position: relative;">
                            <input type="password" id="new-pass" name="new-pass" required style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                            <img src="../assets/icon/eye-closed.png" id="eyeIconNew" onclick="togglePassword('new-pass', 'eyeIconNew')" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; width: 20px;">
                        </div>
                        <p id="newPassError" style="color: red; display: none; font-size: 12px; margin-top: 5px; font-weight: 500;">* Mật khẩu mới phải từ 8 ký tự, có 1 chữ IN HOA và 1 số</p>
                    </div>

                    <div class="input-group">
                        <label for="confirm-pass">NHẬP LẠI MẬT KHẨU MỚI</label>
                        <div class="password-wrapper" style="position: relative;">
                            <input type="password" id="confirm-pass" name="confirm-pass" required style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                            <img src="../assets/icon/eye-closed.png" id="eyeIconConfirm" onclick="togglePassword('confirm-pass', 'eyeIconConfirm')" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; width: 20px;">
                        <p id="confirmPassError" style="color: red; display: none; font-size: 12px; margin-top: 5px; font-weight: 500;">* Mật khẩu nhập lại không khớp!</p>
                    </div>

                    <button type="submit" id="submitChangeBtn" class="login-button">XÁC NHẬN</button>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/change-pass.js"></script>
    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            console.log('input:', input, 'icon:', icon); // ← thêm dòng này
            if (input.type === 'password') {
                input.type = 'text';
                icon.src = "../assets/icon/eye-open.png";
            } else {
                input.type = 'password';
                icon.src = "../assets/icon/eye-closed.png";
            }
        }
    </script>

</body>
</html>
